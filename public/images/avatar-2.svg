<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <clipPath id="av2-circle"><circle cx="24" cy="24" r="24" /></clipPath>
    <radialGradient id="av2-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>
    <radialGradient id="av2-skin" cx="45%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#e29b69" />
      <stop offset="65%" stop-color="#c27845" />
      <stop offset="100%" stop-color="#9a5223" />
    </radialGradient>
    <linearGradient id="av2-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="av2-shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <g clip-path="url(#av2-circle)">
    <rect width="48" height="48" fill="url(#av2-bg)" />
    <!-- Shoulders -->
    <path d="M7 48 C 7 35, 14 31, 24 31 C 34 31, 41 35, 41 48 Z" fill="url(#av2-shirt)" />
    <!-- Collar opening -->
    <path d="M21 31 L 24 36 L 27 31 Z" fill="#334155" />
    <!-- Neck -->
    <path d="M20 25 H 28 V 33 H 20 Z" fill="#c27845" />
    <!-- Head / Face -->
    <ellipse cx="24" cy="19.5" rx="8.8" ry="10.8" fill="url(#av2-skin)" />
    <!-- Trimmed beard -->
    <path d="M16.5 19 C 16.5 27, 20 29.5, 24 29.5 C 28 29.5, 31.5 27, 31.5 19 C 30 25, 27 27.5, 24 27.5 C 21 27.5, 18 25, 16.5 19 Z" fill="#0f172a" opacity="0.85" />
    <!-- Hair -->
    <path d="M15.5 16 C 15.5 10, 18.5 7.5, 24 7.5 C 29.5 7.5, 32.5 10, 32.5 16 C 31.5 11.5, 28.5 9.5, 24 9.5 C 19 9.5, 16.5 12, 15.5 16 Z" fill="url(#av2-hair)" />
    <!-- Ears -->
    <circle cx="15.2" cy="19.5" r="1.9" fill="#c27845" />
    <circle cx="32.8" cy="19.5" r="1.9" fill="#c27845" />
    <!-- Eyes -->
    <ellipse cx="20.5" cy="19" rx="1.2" ry="1.3" fill="#030712" />
    <ellipse cx="27.5" cy="19" rx="1.2" ry="1.3" fill="#030712" />
    <circle cx="21" cy="18.6" r="0.4" fill="#ffffff" />
    <circle cx="28" cy="18.6" r="0.4" fill="#ffffff" />
    <!-- Eyebrows -->
    <path d="M18.8 16.8 C 20.2 16.2, 22 16.6, 22 16.6" stroke="#030712" stroke-width="1.1" stroke-linecap="round" fill="none" />
    <path d="M26 16.6 C 26 16.6, 27.8 16.2, 29.2 16.8" stroke="#030712" stroke-width="1.1" stroke-linecap="round" fill="none" />
    <!-- Nose -->
    <path d="M24 18.5 V 22.5 H 25" stroke="#78350f" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" />
    <!-- Smile -->
    <path d="M21.8 24.8 C 22.8 25.8, 25.2 25.8, 26.2 24.8" stroke="#ffffff" stroke-width="1" stroke-linecap="round" fill="none" />
  </g>
</svg>
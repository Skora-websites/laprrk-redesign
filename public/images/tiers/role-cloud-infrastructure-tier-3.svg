    <!-- Tooling Stack Pills at Bottom -->
    <g transform="translate(40, 290)"><rect width="135" height="26" rx="6" fill="#041226" stroke="#0B6FC4" stroke-width="1"/><text x="67" y="17" fill="#12AFD8" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">Multi-Cloud Strategy</text></g><g transform="translate(185, 290)"><rect width="135" height="26" rx="6" fill="#041226" stroke="#0B6FC4" stroke-width="1"/><text x="67" y="17" fill="#12AFD8" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">FinOps Leadership</text></g><g transform="translate(330, 290)"><rect width="135" height="26" rx="6" fill="#041226" stroke="#0B6FC4" stroke-width="1"/><text x="67" y="17" fill="#12AFD8" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">Enterprise Security</text></g>

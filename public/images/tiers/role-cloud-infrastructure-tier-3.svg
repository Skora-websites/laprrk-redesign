    <!-- Level Title -->
    <text x="168" y="43" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Principal Cloud Strategist</text>
    
    
        <!-- Enterprise Multi-Region Cloud Radar -->

            <stop offset="0%" stop-color="#061838"/>
            <stop offset="100%" stop-color="#0d284f"/>
        </linearGradient>
        <pattern id="tierGrid_contract-staffing_2" width="26" height="26" patternUnits="userSpaceOnUse">
            <path d="M 26 0 L 0 0 0 26" fill="none" stroke="rgba(11,111,196,0.12)" stroke-width="1"/>
        </pattern>
    </defs>
    
    <!-- Background Container -->
    <rect width="520" height="340" rx="14" fill="url(#tierBg_contract-staffing_2)"/>
    <rect width="520" height="340" rx="14" fill="url(#tierGrid_contract-staffing_2)"/>
    
    <!-- Header Badge -->

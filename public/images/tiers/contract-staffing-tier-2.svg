        <text x="24" y="16" fill="#EAF3FB" font-family="system-ui, sans-serif" font-size="10" font-weight="700">TIER 2 SPECS</text>
    </g>
    
    <!-- Level Title -->
    <text x="168" y="43" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Tier 2</text>
    
    
        <!-- Service Mesh Architecture -->
        <g transform="translate(40, 75)">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 980" width="100%" height="100%">
  <defs>
    <linearGradient id="navGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F8FB" />
    </linearGradient>
    <linearGradient id="brandLogoGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A3E96" />
      <stop offset="50%" stop-color="#0B6FC4" />
      <stop offset="100%" stop-color="#12AFD8" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A3E96" />
      <stop offset="100%" stop-color="#0B6FC4" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#062A55" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="504" height="980" fill="#E5ECF3" />

  <!-- Safari / Chrome Browser URL Bar -->
  <rect x="0" y="0" width="504" height="54" fill="#EAF1F7" />
  <rect x="48" y="10" width="408" height="34" rx="17" fill="#FFFFFF" stroke="#C8D6E2" stroke-width="1.5" />
  <!-- Lock Icon -->
  <g transform="translate(186, 20)">
    <rect x="1" y="5" width="10" height="8" rx="1.5" fill="#0A3E96" />
    <path d="M3.5 5V3.5a2.5 2.5 0 0 1 5 0V5" stroke="#0A3E96" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>
  <text x="204" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#062A55">laprrk.com</text>

  <!-- Website Mobile Header -->
  <rect x="0" y="54" width="504" height="68" fill="url(#navGrad)" stroke="#C8D6E2" stroke-width="1" />
  
  <!-- Laprrk Brand Wordmark -->
  <g transform="translate(32, 73)">
    <!-- Brand geometric icon -->
    <rect x="0" y="2" width="26" height="26" rx="6" fill="#0A3E96" />
    <path d="M7 21V9l12 12V9" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Brand text -->
    <text x="36" y="22" font-family="'Oxanium', system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="0.05em" fill="#062A55">LAPRRK</text>
  </g>

  <!-- Hamburger Menu Button -->
  <g transform="translate(432, 75)">
    <rect x="0" y="0" width="40" height="36" rx="8" fill="#FFFFFF" stroke="#C8D6E2" stroke-width="1.5" />
    <rect x="10" y="12" width="20" height="2.5" rx="1.25" fill="#062A55" />
    <rect x="10" y="18" width="14" height="2.5" rx="1.25" fill="#0B6FC4" />
    <rect x="10" y="24" width="20" height="2.5" rx="1.25" fill="#12AFD8" />
  </g>

  <!-- Hero Content Container -->
  <g transform="translate(32, 148)">
    <!-- Kicker Badge -->
    <rect x="0" y="0" width="248" height="26" rx="13" fill="#DBE4ED" stroke="#C8D6E2" stroke-width="1" />
    <circle cx="12" cy="13" r="4" fill="#12AFD8" />
    <text x="24" y="17" font-family="'Exo 2', sans-serif" font-size="11" font-weight="700" letter-spacing="0.04em" fill="#0A3E96" text-transform="uppercase">GREATER NOIDA &amp; LOUISVILLE</text>

    <!-- Main Headline -->
    <text x="0" y="66" font-family="'Oxanium', sans-serif" font-size="36" font-weight="800" fill="#062A55" letter-spacing="-0.03em">Software built.</text>
    <text x="0" y="110" font-family="'Oxanium', sans-serif" font-size="36" font-weight="800" fill="#0B6FC4" letter-spacing="-0.03em">Engineers placed.</text>
    <text x="0" y="154" font-family="'Oxanium', sans-serif" font-size="36" font-weight="800" fill="#12AFD8" letter-spacing="-0.03em">Teams trained.</text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="196" font-family="'Source Sans 3', sans-serif" font-size="16" font-weight="500" fill="#3A5468" line-height="1.5">
      <tspan x="0" dy="0">Production software in two-week sprints.</tspan>
      <tspan x="0" dy="24">First technical shortlist in 5–7 business days.</tspan>
      <tspan x="0" dy="24">Cohort training with ~70% hands-on lab time.</tspan>
    </text>

    <!-- Primary CTA Button -->
    <rect x="0" y="278" width="440" height="52" rx="12" fill="url(#btnGrad)" />
    <text x="220" y="310" font-family="'Exo 2', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Book 30-Minute Consultation</text>

    <!-- Secondary Action -->
    <rect x="0" y="342" width="440" height="46" rx="12" fill="#FFFFFF" stroke="#C8D6E2" stroke-width="1.5" />
    <text x="220" y="371" font-family="'Exo 2', sans-serif" font-size="15" font-weight="600" fill="#0A3E96" text-anchor="middle">Explore IT Practices →</text>

    <!-- Key Metrics Grid -->
    <g transform="translate(0, 420)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="212" height="96" rx="14" fill="#FFFFFF" stroke="#C8D6E2" stroke-width="1" filter="url(#cardShadow)" />
      <text x="20" y="42" font-family="'Oxanium', sans-serif" font-size="32" font-weight="800" fill="#062A55">50+</text>
      <text x="20" y="66" font-family="'Source Sans 3', sans-serif" font-size="13" font-weight="600" fill="#0B6FC4">Clients Since 2019</text>
      <text x="20" y="82" font-family="'Source Sans 3', sans-serif" font-size="11" fill="#64748B">India &amp; United States</text>

      <!-- Metric 2 -->
      <rect x="228" y="0" width="212" height="96" rx="14" fill="#FFFFFF" stroke="#C8D6E2" stroke-width="1" filter="url(#cardShadow)" />
      <text x="248" y="42" font-family="'Oxanium', sans-serif" font-size="32" font-weight="800" fill="#062A55">200+</text>
      <text x="248" y="66" font-family="'Source Sans 3', sans-serif" font-size="13" font-weight="600" fill="#0B6FC4">Engineers Placed</text>
      <text x="248" y="82" font-family="'Source Sans 3', sans-serif" font-size="11" fill="#64748B">5–7 Day Shortlists</text>
    </g>

    <!-- Delivery Standard Card -->
    <g transform="translate(0, 532)">
      <rect x="0" y="0" width="440" height="110" rx="16" fill="#F4F8FB" stroke="#C8D6E2" stroke-width="1.5" />
      <circle cx="28" cy="30" r="14" fill="#E2EFF9" />
      <!-- Code icon -->
      <path d="M23 26l-4 4 4 4M33 26l4 4-4 4" stroke="#0B6FC4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="52" y="34" font-family="'Oxanium', sans-serif" font-size="15" font-weight="700" fill="#062A55">Two-Week Sprint Cadence</text>
      <text x="28" y="68" font-family="'Source Sans 3', sans-serif" font-size="13" fill="#3A5468">
        <tspan x="28" dy="0">Live software demonstrations every 14 days.</tspan>
        <tspan x="28" dy="20">100% intellectual property &amp; repository ownership.</tspan>
      </text>
    </g>

    <!-- Training Cohort Metric Card -->
    <g transform="translate(0, 658)">
      <rect x="0" y="0" width="440" height="96" rx="16" fill="#FFFFFF" stroke="#C8D6E2" stroke-width="1" filter="url(#cardShadow)" />
      <text x="24" y="42" font-family="'Oxanium', sans-serif" font-size="32" font-weight="800" fill="#0A3E96">500+</text>
      <text x="24" y="66" font-family="'Source Sans 3', sans-serif" font-size="13" font-weight="600" fill="#0B6FC4">Engineers Trained</text>
      <text x="24" y="82" font-family="'Source Sans 3', sans-serif" font-size="11" fill="#64748B">~70% Hands-on lab time · 38% Lift</text>
    </g>
  </g>
</svg>

